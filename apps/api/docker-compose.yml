services:
  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      APP_ENV: local
      FRONTEND_URL: http://localhost:5173
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:5174"]'
      DATABASE_URL: postgresql+asyncpg://verity:verity_dev@postgres:5432/verity_db
      MONGODB_URI: mongodb://mongo:27017/verity_docs
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET_DOCUMENTS: verity-documents
      S3_BUCKET_REPORTS: verity-reports
      S3_PUBLIC_ENDPOINT_URL: http://localhost:4566
      DD_TRACE_ENABLED: "false"
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  worker:
    build:
      context: .
    command: ["arq", "app.workers.queue.WorkerSettings"]
    env_file:
      - .env
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://verity:verity_dev@postgres:5432/verity_db
      MONGODB_URI: mongodb://mongo:27017/verity_docs
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET_DOCUMENTS: verity-documents
      S3_BUCKET_REPORTS: verity-reports
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_USER: verity
      POSTGRES_PASSWORD: verity_dev
      POSTGRES_DB: verity_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verity -d verity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7.0
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    logging:
      driver: "none"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 15s
      retries: 10

  localstack:
    image: localstack/localstack:3.4
    environment:
      SERVICES: s3,textract,secretsmanager,sagemaker
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN:
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  localstack_data:
